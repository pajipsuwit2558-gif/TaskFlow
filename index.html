<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { beige: '#F5E6D3', pink: '#D8B4F8', blue: '#AEC6FF', orange: '#FFC8A2', dark: '#1f2937' } } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .hidden-view { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-[#F5E6D3] dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-white/50 dark:bg-gray-800/50 backdrop-blur-md border-r border-gray-200 dark:border-gray-700 fixed h-full flex flex-col z-20 transition-all duration-300">
        <div class="p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">TaskFlow</h1>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-gray-600 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700 transition-all shadow-md bg-gray-900 text-white dark:bg-white dark:text-gray-900">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
            </button>
            <button onclick="switchPage('activities')" id="nav-activities" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-gray-600 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700 transition-all">
                <i class="fa-solid fa-layer-group w-5 text-center"></i> Activities
            </button>
            <button onclick="switchPage('tasks')" id="nav-tasks" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-gray-600 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700 transition-all">
                <i class="fa-solid fa-border-all w-5 text-center"></i> Tasks
            </button>
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <button onclick="toggleTheme()" class="w-full flex items-center justify-center gap-2 bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all hover:opacity-80">
                <i id="theme-icon" class="fa-solid fa-moon"></i> <span id="theme-text">Dark Mode</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 p-8 overflow-y-auto h-screen">
        
        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-view animate-fade-in block">
            <header class="mb-8">
                <h2 class="text-3xl font-bold dark:text-white">Dashboard Overview</h2>
                <p class="text-gray-500 mt-1">Track your overall progress and analytics.</p>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-brand-pink rounded-3xl p-6 text-gray-900 shadow-sm border border-black/5">
                    <h3 class="text-sm font-semibold opacity-80 mb-2">Total Activities</h3>
                    <div id="stat-activities" class="text-5xl font-bold mt-2">0</div>
                </div>
                <div class="bg-brand-blue rounded-3xl p-6 text-gray-900 shadow-sm border border-black/5">
                    <h3 class="text-sm font-semibold opacity-80 mb-2">Total Tasks</h3>
                    <div id="stat-tasks" class="text-5xl font-bold mt-2">0</div>
                </div>
            </div>
            <!-- Charts Section Removed for simplicity in local version, keeping focus on core app -->
        </div>

        <!-- ACTIVITIES -->
        <div id="page-activities" class="page-view animate-fade-in hidden-view">
            <header class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-3xl font-bold dark:text-white">Activities</h2>
                    <p class="text-gray-500 mt-1">Manage your projects and see overall progress.</p>
                </div>
                <button onclick="addActivity()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-5 py-2.5 rounded-full text-sm font-semibold hover:opacity-90 shadow-md">
                    <i class="fa-solid fa-plus"></i> New Activity
                </button>
            </header>
            <div id="activity-list" class="space-y-4">
                <!-- Activities rendered here -->
            </div>
        </div>

        <!-- TASKS -->
        <div id="page-tasks" class="page-view animate-fade-in hidden-view">
            <div id="tasks-empty-state" class="h-[70vh] flex flex-col items-center justify-center text-center block">
                <div class="w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center text-4xl mb-4 text-gray-400"><i class="fa-solid fa-list-check"></i></div>
                <h2 class="text-2xl font-bold mb-2">No Activity Selected</h2>
                <button onclick="switchPage('activities')" class="mt-6 bg-brand-pink text-gray-900 px-6 py-2 rounded-full font-semibold hover:opacity-90">Go to Activities</button>
            </div>

            <div id="tasks-board-state" class="hidden-view">
                <header class="flex justify-between items-end mb-6 border-b border-gray-200 dark:border-gray-700 pb-4">
                    <div>
                        <button onclick="switchPage('activities')" class="text-sm text-gray-500 hover:text-gray-900 mb-2 flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <h2 id="current-activity-title" class="text-3xl font-bold dark:text-white">Activity Name</h2>
                    </div>
                    <button onclick="addTask()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-5 py-2.5 rounded-full text-sm font-semibold hover:opacity-90">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </header>
                <div class="flex gap-6 overflow-x-auto pb-4 h-[calc(100vh-200px)]">
                    <div class="w-80 min-w-[320px] bg-white/40 dark:bg-gray-800/40 rounded-3xl p-4 flex flex-col">
                        <h3 class="font-bold mb-4"><span class="text-brand-pink mr-2">●</span> To Do</h3>
                        <div id="col-todo" class="flex-1 space-y-3 overflow-y-auto pr-1"></div>
                    </div>
                    <div class="w-80 min-w-[320px] bg-white/40 dark:bg-gray-800/40 rounded-3xl p-4 flex flex-col">
                        <h3 class="font-bold mb-4"><span class="text-brand-blue mr-2">●</span> In Progress</h3>
                        <div id="col-inprogress" class="flex-1 space-y-3 overflow-y-auto pr-1"></div>
                    </div>
                    <div class="w-80 min-w-[320px] bg-white/40 dark:bg-gray-800/40 rounded-3xl p-4 flex flex-col">
                        <h3 class="font-bold mb-4"><span class="text-green-400 mr-2">●</span> Completed</h3>
                        <div id="col-done" class="flex-1 space-y-3 overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- DATA MANAGEMENT (Local Storage) ---
        let appData = JSON.parse(localStorage.getItem('taskflowData')) || { activities: [], tasks: [] };
        let currentActivityId = null;

        function saveData() {
            localStorage.setItem('taskflowData', JSON.stringify(appData));
            updateDashboard();
        }

        // --- THEME & NAVIGATION ---
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            document.getElementById('theme-icon').className = html.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            document.getElementById('theme-text').innerText = html.classList.contains('dark') ? "Light Mode" : "Dark Mode";
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-view').forEach(el => { el.classList.add('hidden-view'); el.classList.remove('block'); });
            document.getElementById('page-' + pageId).classList.remove('hidden-view');
            document.getElementById('page-' + pageId).classList.add('block');
            
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.className = 'nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-gray-600 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700 transition-all';
            });
            document.getElementById('nav-' + pageId).className = 'nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl bg-gray-900 text-white dark:bg-white dark:text-gray-900 transition-all shadow-md';
            
            if(pageId === 'activities') renderActivities();
        }

        // --- ACTIVITIES ---
        function addActivity() {
            const name = prompt("ชื่อ Activity ใหม่:");
            if (!name) return;
            appData.activities.push({ id: Date.now().toString(), name: name });
            saveData();
            renderActivities();
        }

        function renderActivities() {
            const list = document.getElementById('activity-list');
            list.innerHTML = '';
            appData.activities.forEach(act => {
                const actTasks = appData.tasks.filter(t => t.activityId === act.id);
                const doneTasks = actTasks.filter(t => t.status === 'done').length;
                const progress = actTasks.length === 0 ? 0 : Math.round((doneTasks / actTasks.length) * 100);

                list.innerHTML += `
                <div onclick="openActivity('${act.id}', '${act.name}')" class="bg-white dark:bg-gray-800 rounded-2xl p-4 flex items-center gap-6 cursor-pointer hover:shadow-md border border-gray-100 dark:border-gray-700">
                    <div class="w-12 h-12 rounded-xl bg-brand-pink flex items-center justify-center text-gray-900 shadow-sm"><i class="fa-solid fa-folder"></i></div>
                    <div class="flex-1"><h3 class="text-lg font-bold">${act.name}</h3><p class="text-sm text-gray-500">${actTasks.length} Tasks</p></div>
                    <div class="w-48">
                        <div class="flex justify-between text-sm font-semibold mb-1"><span>Progress</span><span>${progress}%</span></div>
                        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3"><div class="bg-gray-900 dark:bg-white rounded-full h-3" style="width: ${progress}%"></div></div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteActivity('${act.id}')" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
        }

        function deleteActivity(id) {
            if(confirm("แน่ใจหรือไม่ที่จะลบ Activity นี้? (งานข้างในจะถูกลบด้วย)")) {
                appData.activities = appData.activities.filter(a => a.id !== id);
                appData.tasks = appData.tasks.filter(t => t.activityId !== id);
                saveData();
                renderActivities();
            }
        }

        function openActivity(id, name) {
            currentActivityId = id;
            document.getElementById('current-activity-title').innerText = name;
            document.getElementById('tasks-empty-state').classList.add('hidden-view');
            document.getElementById('tasks-empty-state').classList.remove('block');
            document.getElementById('tasks-board-state').classList.remove('hidden-view');
            document.getElementById('tasks-board-state').classList.add('block');
            renderTasks();
            switchPage('tasks');
        }

        // --- TASKS ---
        function addTask() {
            const name = prompt("ชื่องาน (Task) ใหม่:");
            if (!name) return;
            appData.tasks.push({ id: Date.now().toString(), activityId: currentActivityId, name: name, status: 'todo' });
            saveData();
            renderTasks();
        }

        function moveTask(taskId, newStatus) {
            const task = appData.tasks.find(t => t.id === taskId);
            if(task) task.status = newStatus;
            saveData();
            renderTasks();
        }

        function renderTasks() {
            document.getElementById('col-todo').innerHTML = '';
            document.getElementById('col-inprogress').innerHTML = '';
            document.getElementById('col-done').innerHTML = '';

            const currentTasks = appData.tasks.filter(t => t.activityId === currentActivityId);
            currentTasks.forEach(task => {
                let controls = '';
                if(task.status === 'todo') {
                    controls = `<button onclick="moveTask('${task.id}', 'inprogress')" class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-xs">Move <i class="fa-solid fa-arrow-right"></i></button>`;
                } else if(task.status === 'inprogress') {
                    controls = `
                        <button onclick="moveTask('${task.id}', 'todo')" class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-xs"><i class="fa-solid fa-arrow-left"></i></button>
                        <button onclick="moveTask('${task.id}', 'done')" class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-xs"><i class="fa-solid fa-arrow-right"></i></button>
                    `;
                } else {
                    controls = `<button onclick="moveTask('${task.id}', 'inprogress')" class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-xs"><i class="fa-solid fa-arrow-left"></i> Undo</button>`;
                }

                const taskHtml = `
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <h4 class="font-bold text-gray-900 dark:text-white mb-3 ${task.status==='done'?'line-through opacity-60':''}">${task.name}</h4>
                    <div class="flex justify-between items-center">${controls}</div>
                </div>`;
                
                document.getElementById('col-' + task.status).innerHTML += taskHtml;
            });
        }

        // --- DASHBOARD ---
        function updateDashboard() {
            document.getElementById('stat-activities').innerText = appData.activities.length;
            document.getElementById('stat-tasks').innerText = appData.tasks.length;
        }

        // Init
        window.onload = () => { updateDashboard(); renderActivities(); };
    </script>
</body>
</html>
